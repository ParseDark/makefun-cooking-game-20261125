<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Line Cook Rush — a tiny kitchen game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; background: #241a12; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Trebuchet MS", Verdana, sans-serif;
  }
  #wrap {
    width: min(1280px, 100vw);
    aspect-ratio: 16 / 9;
    max-height: 100vh;
    position: relative;
  }
  canvas {
    width: 100%; height: 100%; display: block;
    background: #f6ead2; border-radius: 6px;
  }
  #note {
    position: absolute; left: 0; right: 0; bottom: -24px;
    text-align: center; color: #cbb694; font-size: 12px;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="note">Line Cook Rush — keys 1-4, Tab, Space, P, M, H. No network, no sound files: all audio is synthesized.</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
